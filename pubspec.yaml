name: lumina_player
description: Production-ready cross-platform local music player with Liquid Glass UI for Android 11+ and Linux x86_64.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_service: ^0.18.19
  audio_service_mpris: ^1.0.0-beta.4
  audio_metadata_reader: ^1.8.1
  permission_handler: ^13.0.2
  file_picker: ^13.4.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.7
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
